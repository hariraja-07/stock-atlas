name: stockatlas
description: "StockAtlas is a Flutter app that organizes and categorizes NSE stocks by sector or theme (e.g., IT, Banking, Chemicals, Gold). It provides a clean, grouped view of stocks, making it easy to explore different industries at a glance."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  yahoo_finance_data_reader: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/data/stocks.json